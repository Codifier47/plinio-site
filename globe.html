    .scheme-divider { border: none; border-top: 1px solid var(--rule); margin: 16px 0; }
    .scheme-definition { font-family: var(--serif); font-style: italic; font-size: 13px; color: var(--ink-soft); line-height: 1.65; margin-bottom: 14px; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .stat-card { background: rgba(26,26,26,0.05); border-radius: 6px; padding: 8px 10px; }
    .stat-label { font-family: var(--sans); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-muted); margin-bottom: 3px; }
    .stat-value { font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--ink); line-height: 1.2; }
    .scheme-row { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; }
    .scheme-row-label { font-family: var(--sans); font-size: 12px; color: var(--ink-muted); flex-shrink: 0; margin-right: 12px; }
    .scheme-row-value { font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--ink); text-align: right; }
    .api-label { font-family: var(--sans); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-muted); margin: 12px 0 6px; }
    .api-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; font-size: 13px; color: var(--ink); }
    .api-row a { font-size: 12px; color: #3a7bd5; text-decoration: none; }
    .api-row a:hover { text-decoration: underline; }
    .scheme-fact { font-family: var(--serif); font-style: italic; font-size: 13px; color: var(--ink-muted); line-height: 1.6; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule); }
    .no-scheme { font-family: var(--serif); font-style: italic; font-size: 18px; color: var(--ink-muted); line-height: 1.5; margin-top: 8px; }

    @keyframes ripple {
      0%   { transform: scale(1);   opacity: 0.65; }

    .ripple-ring {
      transform-box: fill-box;
      transform-origin: center;
      fill: none;
      stroke: #e8195a;
      stroke-width: 1.2px;
      animation: ripple 2.4s ease-out infinite;
    }
    .ripple-ring.d1 { animation-delay: 0s; }
    .ripple-ring.d2 { animation-delay: 0.8s; }
    .ripple-ring.d3 { animation-delay: 1.6s; }

    // ─── DOT COLORS ───────────────────────────────────────────────────────────

    const COLOR_DEFAULT   = new THREE.Color('#b8b0a4');
    const COLOR_HIGHLIGHT = new THREE.Color('#1a1a1a');

    function resetDotColors() {
      if (!landColors || !landPoints) return;
      for (let i = 0; i < landColors.length; i += 3) {
        landColors[i]     = COLOR_DEFAULT.r;
        landColors[i + 1] = COLOR_DEFAULT.g;
        landColors[i + 2] = COLOR_DEFAULT.b;
      }
      landPoints.geometry.attributes.color.needsUpdate = true;
    }

    function highlightScheme(scheme) {
      resetDotColors();
      if (!scheme) return;
      scheme.countries.forEach(countryName => {
        const country = COUNTRIES.find(c => c.name === countryName);
        if (!country) return;
        const { minLat, maxLat, minLng, maxLng } = country;
        for (let i = 0; i < landPositions.length; i++) {
          const { lat, lng } = landPositions[i];
          if (lat >= minLat && lat <= maxLat && lng >= minLng && lng <= maxLng) {
            landColors[i * 3]     = COLOR_HIGHLIGHT.r;
            landColors[i * 3 + 1] = COLOR_HIGHLIGHT.g;
            landColors[i * 3 + 2] = COLOR_HIGHLIGHT.b;
          }
        }
      });
      landPoints.geometry.attributes.color.needsUpdate = true;
    }

    function updateMarkerColors() {
      if (!markerPoints) return;
      const colors = markerPoints.geometry.attributes.color;
      const colorRest     = new THREE.Color('#e8195a');
      const colorSelected = new THREE.Color('#1a1a1a');
      SCHEMES.forEach((scheme, i) => {
        const c = (selectedScheme && selectedScheme.id === scheme.id) ? colorSelected : colorRest;
        colors.setXYZ(i, c.r, c.g, c.b);
      });
      colors.needsUpdate = true;
    }

    // ─── COORDINATE HELPERS ───────────────────────────────────────────────────

    function latLngToXYZ(lat, lng, r) {
      const phi   = (90 - lat) * Math.PI / 180;
      const theta = (lng + 180) * Math.PI / 180;
      return {
        x: -r * Math.sin(phi) * Math.cos(theta),
        y:  r * Math.cos(phi),
        z:  r * Math.sin(phi) * Math.sin(theta),
      };
    }

    function xyzToLatLng(x, y, z) {
      const r = Math.sqrt(x*x + y*y + z*z);
      const lat = 90 - Math.acos(y / r) * 180 / Math.PI;
      const lng = (Math.atan2(z, -x) * 180 / Math.PI) - 180;
      return { lat, lng: lng < -180 ? lng + 360 : lng };
    }

    // ─── COUNTRY LOOKUP ───────────────────────────────────────────────────────

    function getCountryAtLatLng(lat, lng) {
      const matches = COUNTRIES.filter(c =>
        lat >= c.minLat && lat <= c.maxLat && lng >= c.minLng && lng <= c.maxLng
      );
      if (matches.length === 0) return null;
      if (matches.length === 1) return matches[0];
      let best = null, bestDist = Infinity;
      for (const c of matches) {
        const d = (lat - c.centroidLat) ** 2 + (lng - c.centroidLng) ** 2;
        if (d < bestDist) { bestDist = d; best = c; }
      }
      return best;
    }

    // ─── GLOBE BUILDING ───────────────────────────────────────────────────────

    function buildGlobe(imageData, imgWidth, imgHeight) {
      const N = 60000, R = 1.0;
      const positions = [], colors = [], meta = [];
      const goldenRatio = (1 + Math.sqrt(5)) / 2;

      for (let i = 0; i < N; i++) {
        const theta = Math.acos(1 - 2 * (i + 0.5) / N);
        const phi   = 2 * Math.PI * i / goldenRatio;
        const lat   = 90 - theta * 180 / Math.PI;
        const lng   = (phi * 180 / Math.PI) % 360 - 180;

        const px  = Math.floor((lng + 180) / 360 * imgWidth);
        const py  = Math.floor((90 - lat)  / 180 * imgHeight);
        const idx = (py * imgWidth + px) * 4;

        if (imageData.data[idx] < 10) {
          const pos = latLngToXYZ(lat, lng, R);
          positions.push(pos.x, pos.y, pos.z);
          colors.push(COLOR_DEFAULT.r, COLOR_DEFAULT.g, COLOR_DEFAULT.b);
          meta.push({ lat, lng });
        }
      }

      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
      geom.setAttribute('color',    new THREE.BufferAttribute(new Float32Array(colors), 3));

      landPoints    = new THREE.Points(geom, new THREE.PointsMaterial({ size: 0.012, sizeAttenuation: true, vertexColors: true }));
      landColors    = geom.attributes.color.array;
      landPositions = meta;
      globe.add(landPoints);

      buildMarkers();
      startAnimation();
    }

    // ─── MARKERS (scheme-centric) ──────────────────────────────────────────────

    function buildMarkers() {
      const MIN_SIZE = 0.035, MAX_SIZE = 0.11;
      const colorRest = new THREE.Color('#e8195a');
      const positions = [], colors = [], sizes = [];
      schemeMarkerMap = {};

      SCHEMES.forEach((scheme, i) => {
        const pop        = scheme.populationM || 1;
        const normalized = Math.log(pop) / Math.log(500);
        const size       = MIN_SIZE + normalized * (MAX_SIZE - MIN_SIZE);

        const pos = latLngToXYZ(scheme.markerLat, scheme.markerLng, 1.02);
        positions.push(pos.x, pos.y, pos.z);
        colors.push(colorRest.r, colorRest.g, colorRest.b);
        sizes.push(size);
        schemeMarkerMap[i] = scheme.id;
      });

      markerSizes     = new Float32Array(sizes);
      markerBaseSizes = new Float32Array(sizes);

      markerGeometry = new THREE.BufferGeometry();
      markerGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
      markerGeometry.setAttribute('color',    new THREE.BufferAttribute(new Float32Array(colors), 3));
      markerGeometry.setAttribute('size',     new THREE.BufferAttribute(markerSizes, 1));

      const markerMat = new THREE.ShaderMaterial({
        vertexShader: `
          attribute float size;
          attribute vec3 color;
          varying vec3 vColor;
          void main() {
            vColor = color;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = size * (300.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          void main() {
            if (length(gl_PointCoord - vec2(0.5)) > 0.5) discard;
            gl_FragColor = vec4(vColor, 1.0);
          }
        `,
      });

      markerPoints = new THREE.Points(markerGeometry, markerMat);
      globe.add(markerPoints);

      buildRipples();
    }

    // ─── RIPPLE RINGS ─────────────────────────────────────────────────────────

    function buildRipples() {
      const svg = document.getElementById('ripple-svg');
      if (!svg) return;
      svg.innerHTML = '';
      SCHEMES.forEach(scheme => {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.dataset.schemeId = scheme.id;
        const pop        = scheme.populationM || 1;
        const normalized = Math.log(pop) / Math.log(500);
        const baseR      = 4 + normalized * 8;
        for (let d = 0; d < 3; d++) {
          const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circle.setAttribute('r', baseR);
          circle.setAttribute('class', `ripple-ring d${d + 1}`);
          g.appendChild(circle);
        }
        svg.appendChild(g);
      });
    }

    function updateRipples() {
      const svg = document.getElementById('ripple-svg');
      if (!svg) return;
      const W = globeArea.offsetWidth;
      const H = globeArea.offsetHeight;
      SCHEMES.forEach(scheme => {
        const g = svg.querySelector(`[data-scheme-id="${scheme.id}"]`);
        if (!g) return;
        const pos3d = latLngToXYZ(scheme.markerLat, scheme.markerLng, 1.02);
        const vec   = new THREE.Vector3(pos3d.x, pos3d.y, pos3d.z);
        vec.applyEuler(globe.rotation);
        if (vec.z < 0.05) { g.style.display = 'none'; return; }
        g.style.display = '';
        const projected = vec.clone().project(camera);
        const x = (projected.x *  0.5 + 0.5) * W;
        const y = (projected.y * -0.5 + 0.5) * H;
        g.setAttribute('transform', `translate(${x}, ${y})`);
      });
    }

    // ─── ANIMATION ────────────────────────────────────────────────────────────

    function startAnimation() {
      function animate() {
        requestAnimationFrame(animate);

        if (isIdle) globe.rotation.y += 0.0015;

        renderer.render(scene, camera);
        updateRipples();
      }
      animate();
    }

    // ─── INTERACTION ──────────────────────────────────────────────────────────

    function resetIdleTimer() {
      isIdle = false;
      if (idleTimer) clearTimeout(idleTimer);
      idleTimer = setTimeout(() => { isIdle = true; }, 3000);
    }

    renderer.domElement.addEventListener('mousedown', e => {
      mouseDown = true;
      lastMouseX = mouseDownX = e.clientX;
      lastMouseY = mouseDownY = e.clientY;
      resetIdleTimer();
    });

    window.addEventListener('mousemove', e => {
      if (!mouseDown) return;
      globe.rotation.y += (e.clientX - lastMouseX) * 0.005;
      globe.rotation.x += (e.clientY - lastMouseY) * 0.005;
      globe.rotation.x = Math.max(-0.5, Math.min(0.5, globe.rotation.x));
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
    });

    window.addEventListener('mouseup', e => {
      if (!mouseDown) return;
      const moved = Math.hypot(e.clientX - mouseDownX, e.clientY - mouseDownY);
      if (moved < 4) handleClick(e.clientX, e.clientY);
      mouseDown = false;
      resetIdleTimer();
    });

    renderer.domElement.addEventListener('wheel', e => {
      e.preventDefault();
      camera.position.z = Math.max(1.5, Math.min(4.0, camera.position.z - e.deltaY * 0.001));
    }, { passive: false });

    // Touch
    let lastTouchX = 0, lastTouchY = 0, touchDownX = 0, touchDownY = 0;
    renderer.domElement.addEventListener('touchstart', e => {
      const t = e.touches[0];
      lastTouchX = touchDownX = t.clientX;
      lastTouchY = touchDownY = t.clientY;
      resetIdleTimer(); e.preventDefault();
    }, { passive: false });

    renderer.domElement.addEventListener('touchmove', e => {
      const t = e.touches[0];
      globe.rotation.y += (t.clientX - lastTouchX) * 0.005;
      globe.rotation.x += (t.clientY - lastTouchY) * 0.005;
      globe.rotation.x = Math.max(-0.5, Math.min(0.5, globe.rotation.x));
      lastTouchX = t.clientX; lastTouchY = t.clientY;
      e.preventDefault();
    }, { passive: false });

    renderer.domElement.addEventListener('touchend', e => {
      const t = e.changedTouches[0];
      const moved = Math.hypot(t.clientX - touchDownX, t.clientY - touchDownY);
      if (moved < 4) handleClick(t.clientX, t.clientY);
      resetIdleTimer(); e.preventDefault();
    }, { passive: false });

    // ─── CLICK DETECTION ─────────────────────────────────────────────────────

    const raycaster = new THREE.Raycaster();
    // invisible sphere for land-click fallback
    const hitSphere = new THREE.Mesh(
      new THREE.SphereGeometry(1.0, 32, 32),
      new THREE.MeshBasicMaterial({ visible: false, side: THREE.FrontSide })
    );
    globe.add(hitSphere);

    function selectScheme(scheme) {
      selectedScheme = scheme;
      highlightScheme(scheme);
      updateMarkerColors();
      showSidebarScheme(scheme);
    }

    function handleClick(clientX, clientY) {
      const rect = renderer.domElement.getBoundingClientRect();
      const mouse = new THREE.Vector2(
        ((clientX - rect.left)  / rect.width)  * 2 - 1,
        -((clientY - rect.top) / rect.height) * 2 + 1
      );
      raycaster.setFromCamera(mouse, camera);

      // 1 — Try hitting a marker dot first
      if (markerPoints) {
        raycaster.params.Points = { threshold: 0.04 };
        const markerHits = raycaster.intersectObject(markerPoints);
        if (markerHits.length > 0) {
          const idx    = markerHits[0].index;
          const sId    = schemeMarkerMap[idx];
          const scheme = SCHEMES_BY_ID[sId];
          if (scheme) { selectScheme(scheme); return; }
        }
      }

      // 2 — Fall back to land sphere hit → country → scheme lookup
      const hits = raycaster.intersectObject(hitSphere);
      if (hits.length === 0) return;

      const localPoint = globe.worldToLocal(hits[0].point.clone());
      const { lat, lng } = xyzToLatLng(localPoint.x, localPoint.y, localPoint.z);
      const country = getCountryAtLatLng(lat, lng);
      if (!country) return;

      const ids = COUNTRY_TO_SCHEMES[country.name];
      if (!ids || ids.length === 0) {
        // Country has no scheme — show no-scheme message
        selectedScheme = null;
        resetDotColors();
        updateMarkerColors();
        sidebarContent.innerHTML = `<p class="no-scheme" style="margin-top:80px">No major instant payment scheme documented for ${country.name}.</p>`;
        return;
      }

      // Pick the scheme whose marker is closest to the click lat/lng
      let bestScheme = null, bestDist = Infinity;
      ids.forEach(id => {
        const s = SCHEMES_BY_ID[id];
        if (!s) return;
        const d = (lat - s.markerLat) ** 2 + (lng - s.markerLng) ** 2;
        if (d < bestDist) { bestDist = d; bestScheme = s; }
      });
      if (bestScheme) selectScheme(bestScheme);
    }

    // ─── RESIZE ───────────────────────────────────────────────────────────────

    window.addEventListener('resize', () => {
      camera.aspect = globeArea.offsetWidth / globeArea.offsetHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(globeArea.offsetWidth, globeArea.offsetHeight);
    });

    // ─── LAND MASK LOADING ────────────────────────────────────────────────────

    const offCanvas = document.createElement('canvas');
    offCanvas.width = 1024; offCanvas.height = 512;
    const ctx = offCanvas.getContext('2d');

    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      ctx.drawImage(img, 0, 0, 1024, 512);
      buildGlobe(ctx.getImageData(0, 0, 1024, 512), 1024, 512);
    };
    img.onerror = () => console.error('Land mask failed to load — must be served over HTTP');
    img.src = 'https://cdn.jsdelivr.net/npm/three-globe@2.27.2/example/img/earth-dark.jpg';

    showSidebarDefault();
  </script>
</body>
</html>
