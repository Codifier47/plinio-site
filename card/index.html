<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Plinio Diouf · Contact</title>
  <meta name="description" content="Plinio Diouf. Customer Success & Account Management. Houston, Texas." />
  <!-- Contact card for the QR code. Keep it out of search results (it lists a phone number). -->
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#f4f1ea" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/card/avatar.jpg" />

  <meta property="og:title" content="Plinio Diouf · Contact" />
  <meta property="og:description" content="Customer Success & Account Management. Houston, Texas." />
  <meta property="og:type" content="profile" />
  <meta property="og:url" content="https://plinio.me/card" />
  <meta property="og:image" content="https://plinio.me/og-image.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --paper: #f4f1ea;
      --card: #fbf9f4;
      --ink: #1a1a1a;
      --ink-soft: #3d3d3d;
      --ink-muted: #8a8578;
      --rule: rgba(26, 26, 26, 0.12);
      --serif: "Fraunces", Georgia, "Times New Roman", serif;
      --sans: "Inter Tight", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      background: var(--paper);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
    }

    .page {
      max-width: 440px;
      margin: 0 auto;
      padding-bottom: calc(40px + env(safe-area-inset-bottom));
    }

    /* PHOTO */
    .photo {
      position: relative;
      aspect-ratio: 4 / 4.6;
      overflow: hidden;
      background: var(--paper);
    }
    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 30%;
      display: block;
      /* Fade the bottom of the photo into the paper. */
      -webkit-mask-image: linear-gradient(to bottom, #000 64%, rgba(0, 0, 0, 0.35) 84%, transparent 98%);
      mask-image: linear-gradient(to bottom, #000 64%, rgba(0, 0, 0, 0.35) 84%, transparent 98%);
    }
    .share {
      position: absolute;
      top: calc(14px + env(safe-area-inset-top));
      right: 14px;
      z-index: 2;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(26, 26, 26, 0.38);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .share svg { width: 18px; height: 18px; }

    /* NAME */
    .intro {
      position: relative;
      z-index: 1;
      margin-top: -64px;
      padding: 0 24px;
      text-align: center;
    }
    h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 40px;
      line-height: 1.05;
      letter-spacing: -0.02em;
    }
    .role {
      margin-top: 10px;
      font-size: 15px;
      color: var(--ink-soft);
    }
    .loc {
      margin-top: 2px;
      font-size: 14px;
      color: var(--ink-muted);
    }

    /* SAVE CONTACT */
    .save {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 26px 20px 0;
      padding: 17px 20px;
      border-radius: 999px;
      background: var(--ink);
      color: var(--paper);
      text-decoration: none;
      font-weight: 500;
      font-size: 16px;
      transition: transform 0.15s ease;
    }
    .save:active { transform: scale(0.98); }
    .save svg { width: 19px; height: 19px; }

    /* LINKS */
    .links {
      list-style: none;
      margin: 18px 20px 0;
      background: var(--card);
      border: 1px solid var(--rule);
      border-radius: 20px;
      overflow: hidden;
    }
    .links li + li { border-top: 1px solid var(--rule); }
    .row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px 16px;
      color: inherit;
      text-decoration: none;
      min-height: 68px;
    }
    a.row:active { background: rgba(26, 26, 26, 0.04); }
    .icon {
      flex: none;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--paper);
      display: grid;
      place-items: center;
    }
    .icon svg { width: 19px; height: 19px; }
    .text { flex: 1; min-width: 0; }
    .label, .value { display: block; }
    .label { font-size: 15px; font-weight: 500; }
    .value {
      font-size: 14px;
      color: var(--ink-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chev { flex: none; width: 16px; height: 16px; color: var(--ink-muted); }

    .pills { display: flex; gap: 8px; padding: 0 16px 15px 68px; margin-top: -4px; }
    .pill {
      padding: 8px 13px;
      border-radius: 999px;
      border: 1px solid var(--rule);
      background: var(--paper);
      color: var(--ink);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    .pill:active { background: #ebe6db; }

    footer {
      margin-top: 32px;
      text-align: center;
      font-family: var(--serif);
      font-style: italic;
      font-size: 15px;
      color: var(--ink-muted);
    }
    footer a { color: inherit; text-decoration: none; }

    /* Wider screens: show it as a card. */
    @media (min-width: 560px) {
      body { padding: 48px 0; }
      .page {
        background: var(--paper);
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 1px 0 rgba(26, 26, 26, 0.04), 0 24px 60px -20px rgba(26, 26, 26, 0.25);
      }
      body { background: #e9e4d8; }
      .share { top: 14px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="photo">
      <img src="/card/plinio.jpg" alt="Plinio Diouf" width="900" height="1125" />
      <button class="share" id="share" type="button" aria-label="Share this page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
      </button>
    </div>

    <section class="intro">
      <h1>Plinio Diouf</h1>
      <p class="role">Customer Success &amp; Account Management</p>
      <p class="loc">Houston, Texas</p>
    </section>

    <a class="save" href="/card/plinio-diouf.vcf" download="Plinio Diouf.vcf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M19 8v6M16 11h6"/></svg>
      Save contact
    </a>

    <ul class="links">
      <li>
        <div class="row">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
        </span>
        <span class="text">
          <span class="label">Phone number</span>
          <span class="value">+1 737 342 2230</span>
        </span>
        </div>
        <div class="pills">
          <a class="pill" href="tel:+17373422230">Call</a>
          <a class="pill" href="https://wa.me/17373422230" target="_blank" rel="noopener">WhatsApp</a>
        </div>
      </li>
      <li>
        <a class="row" href="mailto:dioufplinio@gmail.com">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
          </span>
          <span class="text">
            <span class="label">Email</span>
            <span class="value">dioufplinio@gmail.com</span>
          </span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
        </a>
      </li>
      <li>
        <a class="row" href="https://www.linkedin.com/in/plinio-diouf" target="_blank" rel="noopener">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.75h4v11H3zM9.5 9.75h3.8v1.5h.06c.53-1 1.83-1.75 3.37-1.75 3.6 0 4.27 2.2 4.27 5.06v6.19h-4v-5.49c0-1.31-.02-3-1.83-3-1.83 0-2.11 1.43-2.11 2.9v5.59h-4z"/></svg>
          </span>
          <span class="text">
            <span class="label">LinkedIn</span>
            <span class="value">linkedin.com/in/plinio-diouf</span>
          </span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
        </a>
      </li>
      <li>
        <a class="row" href="https://plinio.me">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
          </span>
          <span class="text">
            <span class="label">Website</span>
            <span class="value">plinio.me</span>
          </span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
        </a>
      </li>
      <li>
        <a class="row" href="https://cal.com/plinio-diouf/quick-chat-plinio" target="_blank" rel="noopener">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          </span>
          <span class="text">
            <span class="label">Book a call</span>
            <span class="value">Pick a time on Cal.com</span>
          </span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
        </a>
      </li>
    </ul>

    <footer><a href="https://plinio.me">plinio.me</a></footer>
  </main>

  <script>
    // Share sheet on phones; copy the link elsewhere.
    document.getElementById("share").addEventListener("click", async () => {
      const data = { title: "Plinio Diouf", url: "https://plinio.me/card" };
      if (navigator.share) {
        try { await navigator.share(data); } catch (e) {}
      } else if (navigator.clipboard) {
        await navigator.clipboard.writeText(data.url);
        alert("Link copied");
      }
    });
  </script>
</body>
</html>
